name: Collect data and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Seoul
    # Recovery checks. Skip collection only after today's refresh is publicly deployed.
    - cron: '17 8-11 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:
    inputs:
      refresh_statistics:
        description: '7일 제한과 관계없이 공식 인구 통계 확인'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robotaxi-atlas-publish
  cancel-in-progress: false

jobs:
  check-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: check
        name: Check whether today's refresh is already publicly deployed
        run: node scripts/refresh-schedule.mjs
  collect-build:
    needs: check-refresh
    if: needs.check-refresh.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued manual runs collect from the latest data commit on main.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Validate data rules
        run: pnpm test
      - name: Collect public sources and apply protected manual records
        run: pnpm collect
      - name: Check official statistics weekly and preserve reference dates
        run: node scripts/collect-statistics.mjs
        env:
          FORCE_STATISTICS: ${{ inputs.refresh_statistics || 'false' }}
      - name: Monitor 50 states and DC and US discovery feeds
        run: node scripts/collect-monitoring.mjs
      - name: Save daily data and correction history
        run: |
          git config user.name 'robotaxi-atlas[bot]'
          git config user.email 'robotaxi-atlas[bot]@users.noreply.github.com'
          node scripts/build-scenarios.mjs
          git add public/data/atlas.json public/data/statistics.json public/data/scenarios.json public/data/monitoring.json data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh source checks and daily snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Collection summary
        run: |
          node -e 'const d=require("./public/data/atlas.json"); console.log("Run:", d.runs.at(-1).state); for(const r of d.sourceRuns) console.log(r.sourceId+": "+r.state+" — "+r.message)' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const d=require("./public/data/statistics.json"); console.log("Statistics checked:", d.lastAttemptAt); for(const r of d.checks) console.log(r.sourceId+": "+r.state+" — "+r.message)' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const d=require("./public/data/monitoring.json"); console.log("US documents:", JSON.stringify(d.summary)); console.log("Global discovery:",JSON.stringify(d.discovery.lastRun)); for(const r of d.registries)console.log(r.id+": "+r.checkState+" total="+r.total)' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const d=require("./public/data/monitoring.json"); for(const s of d.modelHistory??[])console.log("Model history "+s.sourceId+": "+s.checkState+" observations="+s.observations.length+" lastSuccess="+s.lastSuccessAt+" error="+(s.error??"none"))' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
