name: Collect data and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # 23:00 UTC = next day 08:00 Asia/Seoul (no daylight saving).
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robotaxi-atlas-publish
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Validate data rules
        run: pnpm test
      - name: Collect public sources and apply protected manual records
        run: pnpm collect
      - name: Save daily data and correction history
        run: |
          git config user.name 'robotaxi-atlas[bot]'
          git config user.email 'robotaxi-atlas[bot]@users.noreply.github.com'
          git add public/data/atlas.json data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh source checks and daily snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Collection summary
        run: |
          node -e 'const d=require("./public/data/atlas.json"); console.log("Run:", d.runs.at(-1).state); for(const r of d.sourceRuns) console.log(r.sourceId+": "+r.state+" — "+r.message)' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
